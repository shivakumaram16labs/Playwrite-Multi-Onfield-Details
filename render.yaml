services:
  - type: web
    name: onfield-snapshot-gallery
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_HOST
        value: kbocwwb.karnataka.gov.in
      - key: RENDER_TIMEOUT_MS
        value: "45000"
      - key: POST_LOAD_WAIT_MS
        value: "1200"
      - key: MAX_UPLOAD_MB
        value: "20"